method: probed
source: live anonymous probes of /.well-known/ on every Apollo Education Group / University of
  Phoenix host the record knows, 2026-09-04
summary: >-
  Exactly one real document is served anywhere: the OpenID Connect discovery document on
  login.phoenix.edu, the ForgeRock Access Management authorization server behind the University
  of Phoenix student/staff single sign-on. That 200 carries a genuine RFC 8414 / OIDC Discovery
  JSON body and is what earns the WellKnown pointer. Nothing else exists on any host — no
  security.txt (so NO SecurityTxt pointer), no api-catalog, no ai-plugin.json, and no A2A agent
  card at either the canonical or the legacy path.
ownership: >-
  phoenix.edu and its subdomains are the operating domain of University of Phoenix, the
  institution Apollo Education Group operates and the site apis.yml already records as this
  company's website. login.phoenix.edu is the institution's own SSO host, reached by following
  the portal.phoenix.edu redirect; the issuer it advertises is https://login.phoenix.edu:443/am/oauth2.
pointer_basis: >-
  WellKnown pointer emitted on the strength of the single 200 on login.phoenix.edu carrying a
  parseable OIDC discovery document. SecurityTxt pointer NOT emitted — RFC 9116 is unimplemented
  on every host probed. AgentCard pointer NOT emitted — no agent card was found.
false_positive_watch: >-
  Three hosts answer HTTP 200 with a catch-all body for EVERY /.well-known/* path and are
  recorded below as MISSES, not hits: sso.phoenix.edu returns a 2,298-byte XHTML error page,
  portal.phoenix.edu returns a 795-byte SPA shell, and phoenixeducationpartners.com returns the
  11-byte string "Invalid key" for every path. Any future round that reads one of those 200s as
  a served document is wrong.
