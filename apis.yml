description: >-
  Apollo Education Group is a private education provider that operates the University
  of Phoenix and other institutions offering associate's, bachelor's, master's, and
  doctoral degree programs. The organization focuses on providing accessible higher
  education to working adult learners through online and in-person formats. Taken
  private in 2017, the group has since been renamed Phoenix Education Partners; the
  former apolloeducationgroup.com domain no longer serves and the live surface is the
  operating institution's site at phoenix.edu. There is no public developer program:
  the only machine-readable contracts the group publishes are the identity documents
  behind its student single sign-on.
apis:
  - aid: apollo-education-group:phoenix-sso-openid-connect
    name: University of Phoenix Single Sign-On (OpenID Connect / OAuth 2.0)
    description: >-
      The University of Phoenix identity provider, running ForgeRock Access Management in the
      /alpha realm. The OpenID Connect discovery document is served anonymously (HTTP 200,
      2026-09-04) at https://login.phoenix.edu/.well-known/openid-configuration and is saved
      verbatim in this repository, alongside a SAML 2.0 metadata document served from the same
      host. Both are real, self-describing, machine-readable contracts. Neither is a developer
      API: this is the sign-on for students, faculty and staff reaching MyPhoenix and eCampus,
      there is no documented client-registration route, no published scope reference beyond
      what the discovery document itself advertises, and no developer documentation of any
      kind. Listed because the artifacts are genuine, not because they are self-serve.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/apollo-education-group.png
    humanURL: https://my.phoenix.edu/
    baseURL: https://login.phoenix.edu/am/oauth2
    tags:
      - Authentication
      - OpenID Connect
      - SAML
      - Gated
    properties:
      - type: WellKnown
        url: well-known/apollo-education-group-openid-configuration.json
      - type: WellKnown
        url: https://login.phoenix.edu/.well-known/openid-configuration
